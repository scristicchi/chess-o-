<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scacchi — Edizione Legno</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  :root {
    --legno-chiaro: #F0D9B5;
    --legno-scuro: #B58863;
    --bg: #2b2320;
    --pannello: #3c322c;
    --testo: #eee3d3;
    --accento: #d97757;
    --verde: #6fae5c;
    --evidenzia: #ff3333;
    --mossa-possibile: rgba(60, 160, 60, 0.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #3a2f28 0%, #201a16 70%);
    color: var(--testo);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px 48px;
  }
  h1 {
    font-weight: 400;
    letter-spacing: 0.08em;
    font-size: 1.6rem;
    margin: 0 0 4px;
  }
  .sottotitolo {
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accento);
    margin-bottom: 20px;
  }
  .layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  .colonna-centrale {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .controlli { display: flex; gap: 10px; margin-bottom: 14px; }
  button {
    font-family: inherit;
    background: var(--pannello);
    color: var(--testo);
    border: 1px solid #5a4c40;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #4a3e35; border-color: var(--accento); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #turno {
    font-size: 1rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
    min-height: 1.2em;
    text-align: center;
  }
  #turno.scacco { color: var(--evidenzia); font-weight: bold; }
  #wrap-canvas { position: relative; }
  canvas#scacchiera {
    border: 6px solid #23180f;
    border-radius: 2px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    touch-action: none;
  }
  .momentum-wrap { width: 100%; max-width: 600px; margin-top: 16px; }
  .momentum-label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; color: #cbbfae; }
  #barra-momentum { display: flex; height: 18px; border-radius: 3px; overflow: hidden; border: 1px solid #5a4c40; }
  #seg-bianco { background: var(--legno-chiaro); transition: width 0.3s; }
  #seg-nero { background: var(--legno-scuro); transition: width 0.3s; }

  .mangiati { display: flex; gap: 24px; margin-top: 16px; font-size: 1.1rem; flex-wrap: wrap; justify-content: center; }
  .mangiati-blocco { background: var(--pannello); border: 1px solid #5a4c40; border-radius: 6px; padding: 8px 14px; min-width: 180px; text-align: center; }
  .mangiati-blocco .titolo { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accento); display: block; margin-bottom: 4px; }

  .pannello-laterale {
    width: 230px;
    background: var(--pannello);
    border: 1px solid #5a4c40;
    border-radius: 6px;
    padding: 14px;
    display: flex;
    flex-direction: column;
  }
  .pannello-laterale h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accento);
    margin: 0 0 10px;
    font-weight: 400;
    border-bottom: 1px solid #5a4c40;
    padding-bottom: 8px;
  }
  #lista-mosse { overflow-y: auto; max-height: 300px; flex: 1; font-size: 0.85rem; line-height: 1.7; }
  .riga-mossa { display: flex; gap: 8px; }
  .riga-mossa .num { color: #8a7a68; width: 22px; }
  .riga-mossa .b, .riga-mossa .n { flex: 1; }

  .pannello-mp p { font-size: 0.8rem; line-height: 1.5; color: #cbbfae; margin: 6px 0; }
  .pannello-mp input {
    width: 100%;
    font-family: inherit;
    background: #241d18;
    color: var(--testo);
    border: 1px solid #5a4c40;
    border-radius: 4px;
    padding: 7px 8px;
    font-size: 0.78rem;
    margin-bottom: 8px;
  }
  .pannello-mp .riga-btn { display: flex; gap: 6px; margin-bottom: 4px; }
  .pannello-mp .riga-btn button { flex: 1; }
  .separatore { text-align: center; font-size: 0.7rem; color: #8a7a68; text-transform: uppercase; letter-spacing: 0.1em; margin: 10px 0; }
  #mp-stato-badge {
    display: inline-block;
    font-size: 0.72rem;
    padding: 3px 8px;
    border-radius: 3px;
    background: #4a3e35;
    margin-bottom: 10px;
    letter-spacing: 0.03em;
  }
  #mp-stato-badge.connesso { background: var(--verde); color: #142310; }
  #mp-stato-badge.attesa { background: var(--accento); color: #2a160c; }

  .promozione-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 10; }
  .promozione-overlay.attivo { display: flex; }
  .promozione-box { background: var(--pannello); border: 1px solid var(--accento); border-radius: 8px; padding: 20px; display: flex; gap: 12px; }
  .promozione-box button { font-size: 2rem; padding: 10px 16px; background: var(--legno-chiaro); color: #222; }
  .promozione-box button:hover { background: var(--accento); color: #fff; }
</style>
</head>
<body>

<h1>Scacchi</h1>
<div class="sottotitolo">Edizione Legno</div>

<div class="layout">

  <div class="pannello-laterale pannello-mp">
    <h2>Gioca con un amico</h2>
    <span id="mp-stato-badge">Modalità locale</span>
    <p id="mp-descrizione">Crea una stanza e manda il link al tuo amico: lui vedrà la scacchiera dal suo lato.</p>
    <div class="riga-btn">
      <button id="btn-crea-stanza">🎲 Crea stanza</button>
    </div>
    <div id="link-stanza-wrap" style="display:none">
      <input id="link-stanza" readonly>
      <div class="riga-btn">
        <button id="btn-copia-link">📋 Copia link</button>
      </div>
    </div>
    <div class="separatore">oppure</div>
    <input id="input-codice" placeholder="Incolla qui il link ricevuto">
    <div class="riga-btn">
      <button id="btn-unisciti">➡️ Unisciti</button>
    </div>
  </div>

  <div class="colonna-centrale">
    <div class="controlli">
      <button id="btn-nuova">🔄 Nuova Partita</button>
    </div>
    <div id="turno">Turno: Bianco</div>
    <div id="wrap-canvas">
      <canvas id="scacchiera" width="600" height="600"></canvas>
    </div>

    <div class="momentum-wrap">
      <div class="momentum-label">
        <span id="val-bianco">Bianco: 39</span>
        <span id="val-nero">Nero: 39</span>
      </div>
      <div id="barra-momentum">
        <div id="seg-bianco" style="width:50%"></div>
        <div id="seg-nero" style="width:50%"></div>
      </div>
    </div>

    <div class="mangiati">
      <div class="mangiati-blocco">
        <span class="titolo">Mangiati dal Bianco</span>
        <span id="mangiati-bianco">—</span>
      </div>
      <div class="mangiati-blocco">
        <span class="titolo">Mangiati dal Nero</span>
        <span id="mangiati-nero">—</span>
      </div>
    </div>
  </div>

  <div class="pannello-laterale">
    <h2>Cronologia mosse</h2>
    <div id="lista-mosse"></div>
  </div>

</div>

<div class="promozione-overlay" id="overlay-promozione">
  <div class="promozione-box" id="box-promozione"></div>
</div>

<script>
(function () {
  const DIM = 600, RIGHE = 8, COLONNE = 8, CASELLA = DIM / COLONNE;
  const LEGNO_CHIARO = "#F0D9B5", LEGNO_SCURO = "#B58863";
  const COLORE_BIANCO_PEZZO = "#F5F1EA", COLORE_NERO_PEZZO = "#141414";
  const EVIDENZIA = "#FF3333";
  const MOSSA_POSSIBILE = "rgba(60,160,60,0.55)";

  const UNICODE = {
    BR: '♔', BQ: '♕', BT: '♖', BA: '♗', BC: '♘', BP: '♙',
    NR: '♚', NQ: '♛', NT: '♜', NA: '♝', NC: '♞', NP: '♟'
  };
  const VALORI = { P: 1, C: 3, A: 3, T: 5, Q: 9, R: 0 };
  const NOMI_ITA = { P: 'Pedone', C: 'Cavallo', A: 'Alfiere', T: 'Torre', Q: 'Regina', R: 'Re' };
  const COLONNE_LETTERE = 'abcdefgh';

  // ---------- Pezzo ----------
  class Pezzo {
    constructor(colore, tipo) {
      this.colore = colore;
      this.tipo = tipo;
      this.simbolo = UNICODE[colore + tipo];
      this.hasMoved = false;
    }
    coloreDestOk(rA, cA, griglia) {
      const p = griglia[rA][cA];
      return p === null || p.colore !== this.colore;
    }
    mossaValida() { return false; }
    controlloLineaDritta(rP, cP, rA, cA, griglia) {
      if (rP !== rA && cP !== cA) return false;
      const stepR = rP === rA ? 0 : (rA > rP ? 1 : -1);
      const stepC = cP === cA ? 0 : (cA > cP ? 1 : -1);
      let cr = rP + stepR, cc = cP + stepC;
      while (cr !== rA || cc !== cA) {
        if (griglia[cr][cc] !== null) return false;
        cr += stepR; cc += stepC;
      }
      return true;
    }
    controlloDiagonale(rP, cP, rA, cA, griglia) {
      if (Math.abs(rA - rP) !== Math.abs(cA - cP)) return false;
      const stepR = rA > rP ? 1 : -1;
      const stepC = cA > cP ? 1 : -1;
      let cr = rP + stepR, cc = cP + stepC;
      while (cr !== rA && cc !== cA) {
        if (griglia[cr][cc] !== null) return false;
        cr += stepR; cc += stepC;
      }
      return true;
    }
  }

  class Pedone extends Pezzo {
    mossaValida(rP, cP, rA, cA, griglia) {
      if (!this.coloreDestOk(rA, cA, griglia)) return false;
      const dir = this.colore === 'B' ? -1 : 1;
      const rigaIniziale = this.colore === 'B' ? 6 : 1;
      const dest = griglia[rA][cA];
      if (cP === cA && rA === rP + dir && dest === null) return true;
      if (cP === cA && rP === rigaIniziale && rA === rP + 2 * dir) {
        if (griglia[rP + dir][cP] === null && dest === null) return true;
      }
      if (Math.abs(cA - cP) === 1 && rA === rP + dir && dest !== null) return true;
      return false;
    }
  }
  class Torre extends Pezzo {
    mossaValida(rP, cP, rA, cA, griglia) {
      return this.coloreDestOk(rA, cA, griglia) && this.controlloLineaDritta(rP, cP, rA, cA, griglia);
    }
  }
  class Alfiere extends Pezzo {
    mossaValida(rP, cP, rA, cA, griglia) {
      return this.coloreDestOk(rA, cA, griglia) && this.controlloDiagonale(rP, cP, rA, cA, griglia);
    }
  }
  class Cavallo extends Pezzo {
    mossaValida(rP, cP, rA, cA, griglia) {
      if (!this.coloreDestOk(rA, cA, griglia)) return false;
      const dr = Math.abs(rA - rP), dc = Math.abs(cA - cP);
      return (dr === 2 && dc === 1) || (dr === 1 && dc === 2);
    }
  }
  class Regina extends Pezzo {
    mossaValida(rP, cP, rA, cA, griglia) {
      return this.coloreDestOk(rA, cA, griglia) &&
        (this.controlloLineaDritta(rP, cP, rA, cA, griglia) || this.controlloDiagonale(rP, cP, rA, cA, griglia));
    }
  }
  class Re extends Pezzo {
    mossaValida(rP, cP, rA, cA, griglia) {
      return this.coloreDestOk(rA, cA, griglia) &&
        Math.abs(rA - rP) <= 1 && Math.abs(cA - cP) <= 1 &&
        (rA !== rP || cA !== cP);
    }
  }

  function classeDiTipo(t) {
    return { T: Torre, C: Cavallo, A: Alfiere, Q: Regina, R: Re }[t];
  }
  function nuovaGriglia() {
    const g = Array.from({ length: RIGHE }, () => Array(COLONNE).fill(null));
    for (let col = 0; col < COLONNE; col++) {
      g[1][col] = new Pedone('N', 'P');
      g[6][col] = new Pedone('B', 'P');
    }
    const ordine = ['T', 'C', 'A', 'Q', 'R', 'A', 'C', 'T'];
    for (let col = 0; col < COLONNE; col++) {
      g[0][col] = new (classeDiTipo(ordine[col]))('N', ordine[col]);
      g[7][col] = new (classeDiTipo(ordine[col]))('B', ordine[col]);
    }
    return g;
  }

  function trovaRe(griglia, colore) {
    for (let r = 0; r < RIGHE; r++)
      for (let c = 0; c < COLONNE; c++) {
        const p = griglia[r][c];
        if (p && p.tipo === 'R' && p.colore === colore) return [r, c];
      }
    return null;
  }
  function casellaSottoAttacco(griglia, r, c, coloreAttaccante) {
    for (let rr = 0; rr < RIGHE; rr++)
      for (let cc = 0; cc < COLONNE; cc++) {
        const p = griglia[rr][cc];
        if (p && p.colore === coloreAttaccante) {
          if (p.tipo === 'P') {
            const dir = p.colore === 'B' ? -1 : 1;
            if (r === rr + dir && Math.abs(c - cc) === 1) return true;
          } else if (p.mossaValida(rr, cc, r, c, griglia)) {
            return true;
          }
        }
      }
    return false;
  }
  function subisceScacco(griglia, colore) {
    const pos = trovaRe(griglia, colore);
    if (!pos) return false;
    const avv = colore === 'B' ? 'N' : 'B';
    return casellaSottoAttacco(griglia, pos[0], pos[1], avv);
  }

  // ---------- Stato di gioco ----------
  let griglia = nuovaGriglia();
  let turno = 'B';
  let selezione = null;
  let mosseValidePerSel = [];
  let numeroMossa = 0;
  let storiaMosse = [];
  let mangiatiDalBianco = [];
  let mangiatiDalNero = [];
  let trascinamento = null;
  let gioFinito = false;

  // ---------- Stato multiplayer ----------
  let peer = null;
  let conn = null;
  let multiplayerAttivo = false;
  let ruoloLocale = null;   // 'B' | 'N' -> colore assegnato al giocatore su QUESTO dispositivo
  let prospettiva = 'B';    // da che lato viene disegnata la scacchiera

  const canvas = document.getElementById('scacchiera');
  const ctx = canvas.getContext('2d');

  // Mappa coordinate logiche <-> coordinate su schermo, in base alla prospettiva
  function aSchermo(r, c) {
    if (prospettiva === 'N') return [RIGHE - 1 - r, COLONNE - 1 - c];
    return [r, c];
  }
  function daSchermo(r, c) {
    if (prospettiva === 'N') return [RIGHE - 1 - r, COLONNE - 1 - c];
    return [r, c];
  }

  function coloreDestGraph(pezzo, selezionato) {
    if (selezionato) return EVIDENZIA;
    return pezzo.colore === 'B' ? COLORE_BIANCO_PEZZO : COLORE_NERO_PEZZO;
  }

  function disegna() {
    for (let r = 0; r < RIGHE; r++) {
      for (let c = 0; c < COLONNE; c++) {
        const [sr, sc] = aSchermo(r, c);
        const chiaro = (r + c) % 2 === 0;
        ctx.fillStyle = chiaro ? LEGNO_CHIARO : LEGNO_SCURO;
        ctx.fillRect(sc * CASELLA, sr * CASELLA, CASELLA, CASELLA);
      }
    }
    if (selezione) {
      const [sr, sc] = aSchermo(selezione[0], selezione[1]);
      ctx.fillStyle = "rgba(255,51,51,0.35)";
      ctx.fillRect(sc * CASELLA, sr * CASELLA, CASELLA, CASELLA);
    }
    mosseValidePerSel.forEach(([r, c]) => {
      const [sr, sc] = aSchermo(r, c);
      ctx.beginPath();
      ctx.fillStyle = MOSSA_POSSIBILE;
      ctx.arc(sc * CASELLA + CASELLA / 2, sr * CASELLA + CASELLA / 2, CASELLA * 0.14, 0, Math.PI * 2);
      ctx.fill();
    });
    if (!gioFinito) {
      const posRe = trovaRe(griglia, turno);
      if (posRe && subisceScacco(griglia, turno)) {
        const [sr, sc] = aSchermo(posRe[0], posRe[1]);
        ctx.fillStyle = "rgba(255,0,0,0.35)";
        ctx.fillRect(sc * CASELLA, sr * CASELLA, CASELLA, CASELLA);
      }
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `${CASELLA * 0.72}px serif`;
    for (let r = 0; r < RIGHE; r++) {
      for (let c = 0; c < COLONNE; c++) {
        if (trascinamento && trascinamento.r === r && trascinamento.c === c) continue;
        const p = griglia[r][c];
        if (p) {
          const [sr, sc] = aSchermo(r, c);
          const sel = selezione && selezione[0] === r && selezione[1] === c;
          ctx.fillStyle = coloreDestGraph(p, sel);
          ctx.fillText(p.simbolo, sc * CASELLA + CASELLA / 2, sr * CASELLA + CASELLA / 2 + 2);
        }
      }
    }
    if (trascinamento) {
      ctx.fillStyle = coloreDestGraph(trascinamento.pezzo, true);
      ctx.fillText(trascinamento.pezzo.simbolo, trascinamento.mouseX, trascinamento.mouseY);
    }
    // coordinate ai bordi
    ctx.font = "11px sans-serif";
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    for (let c = 0; c < COLONNE; c++) {
      const [, sc] = aSchermo(0, c);
      const lettera = prospettiva === 'N' ? COLONNE_LETTERE[COLONNE - 1 - c] : COLONNE_LETTERE[c];
      ctx.fillText(lettera, sc * CASELLA + CASELLA - 8, DIM - 6);
    }
    for (let r = 0; r < RIGHE; r++) {
      const [sr] = aSchermo(r, 0);
      const numero = prospettiva === 'N' ? (r + 1) : (RIGHE - r);
      ctx.fillText(numero, 8, sr * CASELLA + 12);
    }
  }

  function nomeGiocatore(colore) {
    if (!multiplayerAttivo) return colore === 'B' ? 'Bianco' : 'Nero';
    const tu = colore === ruoloLocale;
    return `${colore === 'B' ? 'Bianco' : 'Nero'}${tu ? ' (Tu)' : ' (Avversario)'}`;
  }

  function aggiornaTestoTurno() {
    const el = document.getElementById('turno');
    if (gioFinito) return;
    const scacco = subisceScacco(griglia, turno);
    el.textContent = scacco ? `Turno: ${nomeGiocatore(turno)} — SOTTO SCACCO!` : `Turno: ${nomeGiocatore(turno)}`;
    el.classList.toggle('scacco', scacco);
  }

  function calcolaValoreMateriale(colore) {
    let tot = 0;
    for (let r = 0; r < RIGHE; r++)
      for (let c = 0; c < COLONNE; c++) {
        const p = griglia[r][c];
        if (p && p.colore === colore) tot += VALORI[p.tipo] || 0;
      }
    return tot;
  }
  function aggiornaMomentum() {
    const vb = calcolaValoreMateriale('B');
    const vn = calcolaValoreMateriale('N');
    const totale = vb + vn;
    const pctB = totale === 0 ? 50 : (vb / totale) * 100;
    document.getElementById('seg-bianco').style.width = pctB + '%';
    document.getElementById('seg-nero').style.width = (100 - pctB) + '%';
    document.getElementById('val-bianco').textContent = `Bianco: ${vb}`;
    document.getElementById('val-nero').textContent = `Nero: ${vn}`;
  }
  function aggiornaMangiati() {
    document.getElementById('mangiati-bianco').textContent =
      mangiatiDalBianco.length ? mangiatiDalBianco.map(p => p.simbolo).join(' ') : '—';
    document.getElementById('mangiati-nero').textContent =
      mangiatiDalNero.length ? mangiatiDalNero.map(p => p.simbolo).join(' ') : '—';
  }

  function calcolaNotazione(pezzo, rP, cP, rA, cA, cattura, arrocco) {
    const righe = '87654321';
    if (arrocco === 'corto') return 'O-O';
    if (arrocco === 'lungo') return 'O-O-O';
    let lettera = '';
    if (pezzo.tipo === 'R') lettera = 'R';
    else if (pezzo.tipo === 'Q') lettera = 'D';
    else if (pezzo.tipo === 'T') lettera = 'T';
    else if (pezzo.tipo === 'A') lettera = 'A';
    else if (pezzo.tipo === 'C') lettera = 'C';
    if (pezzo.tipo === 'P' && cattura) lettera = COLONNE_LETTERE[cP];
    const sep = cattura ? 'x' : '';
    return `${lettera}${sep}${COLONNE_LETTERE[cA]}${righe[rA]}`;
  }

  function aggiungiMossaStoria(notazione) {
    storiaMosse.push({ numero: numeroMossa, notazione, turno });
    renderStoria();
  }
  function renderStoria() {
    const cont = document.getElementById('lista-mosse');
    cont.innerHTML = '';
    let coppie = [];
    storiaMosse.forEach(m => {
      if (m.turno === 'B') {
        coppie.push({ b: m.notazione, n: '' });
      } else {
        if (coppie.length && coppie[coppie.length - 1].n === '') {
          coppie[coppie.length - 1].n = m.notazione;
        } else {
          coppie.push({ b: '', n: m.notazione });
        }
      }
    });
    coppie.forEach((cp, i) => {
      const div = document.createElement('div');
      div.className = 'riga-mossa';
      div.innerHTML = `<span class="num">${i + 1}.</span><span class="b">${cp.b}</span><span class="n">${cp.n}</span>`;
      cont.appendChild(div);
    });
    cont.scrollTop = cont.scrollHeight;
  }

  function tentaArrocco(rP, cP, rA, cA) {
    const pezzo = griglia[rP][cP];
    if (!pezzo || pezzo.tipo !== 'R' || pezzo.hasMoved) return [false, null];
    if (rP !== rA || Math.abs(cA - cP) !== 2) return [false, null];
    const dir = cA > cP ? 1 : -1;
    const colTorre = dir === 1 ? 7 : 0;
    const cRePassaggio = cP + dir;
    const cReArrivo = cP + 2 * dir;
    if (cA !== cReArrivo) return [false, null];
    const torre = griglia[rP][colTorre];
    if (!torre || torre.tipo !== 'T' || torre.colore !== pezzo.colore || torre.hasMoved) return [false, null];
    for (let c = Math.min(cP, colTorre) + 1; c < Math.max(cP, colTorre); c++) {
      if (griglia[rP][c] !== null) return [false, null];
    }
    if (subisceScacco(griglia, pezzo.colore)) return [false, null];
    const avv = pezzo.colore === 'B' ? 'N' : 'B';
    if (casellaSottoAttacco(griglia, rP, cRePassaggio, avv)) return [false, null];
    if (casellaSottoAttacco(griglia, rP, cReArrivo, avv)) return [false, null];

    const tipo = dir === 1 ? 'corto' : 'lungo';
    griglia[rA][cA] = pezzo;
    griglia[rP][cP] = null;
    pezzo.hasMoved = true;
    griglia[rP][cRePassaggio] = torre;
    griglia[rP][colTorre] = null;
    torre.hasMoved = true;
    return [true, tipo];
  }

  function passaTurno() {
    turno = turno === 'B' ? 'N' : 'B';
    aggiornaTestoTurno();
    aggiornaMomentum();
    controllaFinePartita();
  }

  function esistonoMossePerColore(colore) {
    for (let r = 0; r < RIGHE; r++)
      for (let c = 0; c < COLONNE; c++) {
        const p = griglia[r][c];
        if (p && p.colore === colore && mosseLegaliPer(r, c).length > 0) return true;
      }
    return false;
  }
  function controllaFinePartita() {
    if (gioFinito) return;
    if (!esistonoMossePerColore(turno)) {
      gioFinito = true;
      const scacco = subisceScacco(griglia, turno);
      const el = document.getElementById('turno');
      if (scacco) {
        const vincitore = turno === 'B' ? 'Nero' : 'Bianco';
        el.textContent = `Scacco matto! Vince il ${vincitore}`;
      } else {
        el.textContent = `Stallo — Patta`;
      }
      el.classList.add('scacco');
    }
  }

  function mosseLegaliPer(r, c) {
    const pezzo = griglia[r][c];
    if (!pezzo) return [];
    const risultati = [];
    for (let rA = 0; rA < RIGHE; rA++) {
      for (let cA = 0; cA < COLONNE; cA++) {
        if (rA === r && cA === c) continue;
        let valida = false;
        let isArrocco = false;
        if (pezzo.tipo === 'R' && rA === r && Math.abs(cA - c) === 2) {
          isArrocco = true;
          valida = puoArroccareVerso(r, c, rA, cA);
        } else if (pezzo.mossaValida(r, c, rA, cA, griglia)) {
          valida = true;
        }
        if (valida && !(isArrocco) && lascerebeSottoScaccoSimulato(r, c, rA, cA)) valida = false;
        if (valida) risultati.push([rA, cA]);
      }
    }
    return risultati;
  }

  function puoArroccareVerso(rP, cP, rA, cA) {
    const pezzo = griglia[rP][cP];
    if (!pezzo || pezzo.tipo !== 'R' || pezzo.hasMoved) return false;
    const dir = cA > cP ? 1 : -1;
    const colTorre = dir === 1 ? 7 : 0;
    const cRePassaggio = cP + dir;
    const cReArrivo = cP + 2 * dir;
    if (cA !== cReArrivo) return false;
    const torre = griglia[rP][colTorre];
    if (!torre || torre.tipo !== 'T' || torre.colore !== pezzo.colore || torre.hasMoved) return false;
    for (let c = Math.min(cP, colTorre) + 1; c < Math.max(cP, colTorre); c++) {
      if (griglia[rP][c] !== null) return false;
    }
    if (subisceScacco(griglia, pezzo.colore)) return false;
    const avv = pezzo.colore === 'B' ? 'N' : 'B';
    if (casellaSottoAttacco(griglia, rP, cRePassaggio, avv)) return false;
    if (casellaSottoAttacco(griglia, rP, cReArrivo, avv)) return false;
    return true;
  }

  function lascerebeSottoScaccoSimulato(rP, cP, rA, cA) {
    const pezzo = griglia[rP][cP];
    const salvato = griglia[rA][cA];
    griglia[rA][cA] = pezzo;
    griglia[rP][cP] = null;
    const risultato = subisceScacco(griglia, pezzo.colore);
    griglia[rP][cP] = pezzo;
    griglia[rA][cA] = salvato;
    return risultato;
  }

  function eseguiPromozione(pezzo, tipoScelto) {
    pezzo.tipo = tipoScelto;
    pezzo.simbolo = UNICODE[pezzo.colore + tipoScelto];
  }
  function mostraSceltaPromozione(pezzo, callback) {
    const overlay = document.getElementById('overlay-promozione');
    const box = document.getElementById('box-promozione');
    box.innerHTML = '';
    ['Q', 'T', 'A', 'C'].forEach(tipo => {
      const btn = document.createElement('button');
      btn.textContent = UNICODE[pezzo.colore + tipo];
      btn.title = NOMI_ITA[tipo];
      btn.onclick = () => { overlay.classList.remove('attivo'); callback(tipo); };
      box.appendChild(btn);
    });
    overlay.classList.add('attivo');
  }

  // ---------- Multiplayer: invio dati ----------
  function inviaMessaggio(msg) {
    if (conn && conn.open) conn.send(msg);
  }
  function broadcastMossa(rP, cP, rA, cA, promozione) {
    if (multiplayerAttivo) inviaMessaggio({ tipo: 'mossa', rP, cP, rA, cA, promozione });
  }
  function broadcastNuovaPartita() {
    if (multiplayerAttivo) inviaMessaggio({ tipo: 'nuova_partita' });
  }

  // rimoto = true quando la mossa arriva dall'avversario (non ribroadcastare)
  function provaMossa(rP, cP, rA, cA, remoto, promozioneForzata) {
    if (gioFinito) return false;
    const pezzoSel = griglia[rP][cP];
    if (!pezzoSel || pezzoSel.colore !== turno) return false;
    if (!remoto && multiplayerAttivo && ruoloLocale !== turno) return false;

    if (pezzoSel.tipo === 'R' && rA === rP && Math.abs(cA - cP) === 2) {
      const [ok, tipoArrocco] = tentaArrocco(rP, cP, rA, cA);
      if (ok) {
        numeroMossa++;
        const nota = calcolaNotazione(pezzoSel, rP, cP, rA, cA, false, tipoArrocco);
        aggiungiMossaStoria(nota);
        selezione = null; mosseValidePerSel = [];
        disegna();
        if (!remoto) broadcastMossa(rP, cP, rA, cA, null);
        passaTurno();
        return true;
      }
      return false;
    }

    if (!pezzoSel.mossaValida(rP, cP, rA, cA, griglia)) return false;

    const destSalvato = griglia[rA][cA];
    const cattura = destSalvato !== null;

    griglia[rA][cA] = pezzoSel;
    griglia[rP][cP] = null;

    if (subisceScacco(griglia, turno)) {
      griglia[rP][cP] = pezzoSel;
      griglia[rA][cA] = destSalvato;
      return false;
    }

    pezzoSel.hasMoved = true;
    if (cattura) {
      if (turno === 'B') mangiatiDalBianco.push(destSalvato);
      else mangiatiDalNero.push(destSalvato);
      aggiornaMangiati();
    }
    numeroMossa++;

    const finalizza = (tipoPromoInviato) => {
      const nota = calcolaNotazione(pezzoSel, rP, cP, rA, cA, cattura, null);
      aggiungiMossaStoria(nota);
      selezione = null; mosseValidePerSel = [];
      disegna();
      if (!remoto) broadcastMossa(rP, cP, rA, cA, tipoPromoInviato || null);
      passaTurno();
    };

    if (pezzoSel.tipo === 'P' && (rA === 0 || rA === 7)) {
      if (remoto) {
        eseguiPromozione(pezzoSel, promozioneForzata || 'Q');
        finalizza(null);
      } else {
        disegna();
        mostraSceltaPromozione(pezzoSel, (tipoScelto) => {
          eseguiPromozione(pezzoSel, tipoScelto);
          finalizza(tipoScelto);
        });
      }
    } else {
      finalizza(null);
    }
    return true;
  }

  // ---------- Input ----------
  function coordDaEvento(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;
    const scRaw = Math.floor(x / CASELLA), rRaw = Math.floor(y / CASELLA);
    const [r, c] = daSchermo(rRaw, scRaw);
    return { x, y, r, c };
  }

  canvas.addEventListener('mousedown', (e) => {
    if (gioFinito) return;
    const { x, y, r, c } = coordDaEvento(e);
    if (r < 0 || r >= RIGHE || c < 0 || c >= COLONNE) return;
    if (multiplayerAttivo && ruoloLocale !== turno) return;
    const pezzo = griglia[r][c];

    if (selezione && mosseValidePerSel.some(([mr, mc]) => mr === r && mc === c)) {
      provaMossa(selezione[0], selezione[1], r, c, false);
      return;
    }

    if (pezzo && pezzo.colore === turno && (!multiplayerAttivo || pezzo.colore === ruoloLocale)) {
      selezione = [r, c];
      mosseValidePerSel = mosseLegaliPer(r, c);
      trascinamento = { r, c, pezzo, mouseX: x, mouseY: y };
      disegna();
    } else {
      selezione = null; mosseValidePerSel = [];
      disegna();
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    if (!trascinamento) return;
    const { x, y } = coordDaEvento(e);
    trascinamento.mouseX = x;
    trascinamento.mouseY = y;
    disegna();
  });

  canvas.addEventListener('mouseup', (e) => {
    if (!trascinamento) return;
    const { r, c } = coordDaEvento(e);
    const origine = trascinamento;
    trascinamento = null;
    if (r >= 0 && r < RIGHE && c >= 0 && c < COLONNE && (r !== origine.r || c !== origine.c)) {
      const mosseOk = mosseValidePerSel.some(([mr, mc]) => mr === r && mc === c);
      if (mosseOk) { provaMossa(origine.r, origine.c, r, c, false); return; }
    }
    disegna();
  });

  canvas.addEventListener('mouseleave', () => {
    if (trascinamento) { trascinamento = null; disegna(); }
  });

  function resetPartitaLocale() {
    griglia = nuovaGriglia();
    turno = 'B';
    selezione = null;
    mosseValidePerSel = [];
    numeroMossa = 0;
    storiaMosse = [];
    mangiatiDalBianco = [];
    mangiatiDalNero = [];
    trascinamento = null;
    gioFinito = false;
    aggiornaTestoTurno();
    aggiornaMomentum();
    aggiornaMangiati();
    renderStoria();
    disegna();
  }

  document.getElementById('btn-nuova').addEventListener('click', () => {
    resetPartitaLocale();
    broadcastNuovaPartita();
  });

  // =====================================================================
  // MULTIPLAYER (PeerJS - connessione diretta browser-browser)
  // =====================================================================
  const badge = document.getElementById('mp-stato-badge');
  const descrizione = document.getElementById('mp-descrizione');
  const btnCrea = document.getElementById('btn-crea-stanza');
  const btnUnisciti = document.getElementById('btn-unisciti');
  const inputCodice = document.getElementById('input-codice');
  const linkWrap = document.getElementById('link-stanza-wrap');
  const linkInput = document.getElementById('link-stanza');

  function impostaBadge(testo, classe) {
    badge.textContent = testo;
    badge.className = classe || '';
  }

  function estraiCodiceStanza(testo) {
    testo = testo.trim();
    try {
      const url = new URL(testo);
      const p = url.searchParams.get('stanza');
      if (p) return p;
    } catch (e) { /* non è un url, va bene, potrebbe essere già il codice */ }
    return testo;
  }

  function configuraCanaleDati(connessione, coloreLocale) {
    conn = connessione;
    multiplayerAttivo = true;
    ruoloLocale = coloreLocale;
    prospettiva = coloreLocale;

    conn.on('data', (msg) => {
      if (!msg || !msg.tipo) return;
      if (msg.tipo === 'mossa') {
        provaMossa(msg.rP, msg.cP, msg.rA, msg.cA, true, msg.promozione);
      }
      if (msg.tipo === 'nuova_partita') {
        resetPartitaLocale();
      }
    });

    conn.on('close', () => {
      impostaBadge('Avversario disconnesso', 'attesa');
      multiplayerAttivo = false;
    });

    impostaBadge(`Connesso — sei il ${coloreLocale === 'B' ? 'Bianco' : 'Nero'}`, 'connesso');
    descrizione.textContent = coloreLocale === 'B'
      ? 'Il tuo amico è entrato nella stanza. Muovi per primo!'
      : 'Sei entrato nella stanza. Vedi la scacchiera dal tuo lato: i tuoi pezzi sono in basso.';
    resetPartitaLocale();
    aggiornaTestoTurno();
  }

  btnCrea.addEventListener('click', () => {
    const idStanza = 'scacchi-legno-' + Math.random().toString(36).slice(2, 9);
    impostaBadge('Creazione stanza…', 'attesa');
    peer = new Peer(idStanza);

    peer.on('open', () => {
      const link = `${location.origin}${location.pathname}?stanza=${idStanza}`;
      linkInput.value = link;
      linkWrap.style.display = 'block';
      impostaBadge('In attesa dell\'avversario…', 'attesa');
      descrizione.textContent = 'Manda questo link al tuo amico. Quando lo apre, la partita comincia: tu giochi il Bianco.';
    });

    peer.on('connection', (connessione) => {
      connessione.on('open', () => {
        connessione.send({ tipo: 'assegna', tuoColore: 'N' });
        configuraCanaleDati(connessione, 'B');
      });
    });

    peer.on('error', (err) => {
      impostaBadge('Errore connessione', 'attesa');
      descrizione.textContent = 'Non è stato possibile creare la stanza (' + err.type + '). Riprova.';
    });
  });

  function entraNellaStanza(idStanza) {
    impostaBadge('Connessione in corso…', 'attesa');
    peer = new Peer();
    peer.on('open', () => {
      const connessione = peer.connect(idStanza, { reliable: true });
      connessione.on('open', () => { /* attendo assegnazione colore dall'host */ });
      connessione.on('data', (msg) => {
        if (msg && msg.tipo === 'assegna') {
          configuraCanaleDati(connessione, msg.tuoColore);
        }
      });
      connessione.on('error', () => {
        impostaBadge('Stanza non trovata', 'attesa');
        descrizione.textContent = 'Controlla il link ricevuto e riprova.';
      });
    });
    peer.on('error', (err) => {
      impostaBadge('Errore connessione', 'attesa');
      descrizione.textContent = 'Non è stato possibile unirsi alla stanza (' + err.type + ').';
    });
  }

  btnUnisciti.addEventListener('click', () => {
    const codice = estraiCodiceStanza(inputCodice.value);
    if (!codice) return;
    entraNellaStanza(codice);
  });

  document.getElementById('btn-copia-link').addEventListener('click', () => {
    linkInput.select();
    navigator.clipboard && navigator.clipboard.writeText(linkInput.value);
  });

  // Unione automatica se l'URL contiene ?stanza=CODICE
  const paramStanza = new URLSearchParams(location.search).get('stanza');
  if (paramStanza) {
    inputCodice.value = paramStanza;
    entraNellaStanza(paramStanza);
  }

  // ---------- Avvio ----------
  aggiornaTestoTurno();
  aggiornaMomentum();
  aggiornaMangiati();
  renderStoria();
  disegna();
})();
</script>
</body>
</html>
